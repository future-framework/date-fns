# date-fns/date-fns's node_tests.yaml: tests (ubuntu-latest, no matrix; Node 26 via mise.toml), for the SuperCI scoreboard.
name: SuperCI (GitHub)

on:
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  test:
    name: test / github
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false

      - uses: jdx/mise-action@v4
      - run: pnpm install

      - name: Node.js tests
        run: mise //pkgs/core:test/node
